version: '3.8'

# ==============================================================================
# Thinkers Platform - Docker Compose Full DevOps Stack
# As specified in Devops-Synopsis.pdf (Django 4.2+, MySQL 8.0, Prometheus, Grafana)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Django Web Application Layer (Gunicorn WSGI Server)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thinkers_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-thinkers-secret-key-prod-2026-safe}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8000}
      - DB_ENGINE=django_prometheus.db.backends.mysql
      - DB_NAME=${MYSQL_DATABASE:-thinkers_db}
      - DB_USER=${MYSQL_USER:-thinkers_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-thinkers_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thinkers_internal
      - thinkers_monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 2. Database Layer (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: thinkers_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_master_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-thinkers_db}
      MYSQL_USER: ${MYSQL_USER:-thinkers_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-thinkers_secure_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    networks:
      - thinkers_internal
      - thinkers_monitoring
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_master_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 3. Web Proxy & Static/Media Cache (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: thinkers_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - thinkers_internal

  # ----------------------------------------------------------------------------
  # 4. Metrics Ingestion Server (Prometheus)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: thinkers_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - thinkers_monitoring

  # ----------------------------------------------------------------------------
  # 5. Alert Management & Notification Dispatcher (Alertmanager)
  # ----------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: thinkers_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - thinkers_monitoring

  # ----------------------------------------------------------------------------
  # 6. Observability Telemetry & Dashboards (Grafana)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: thinkers_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - thinkers_monitoring

  # ----------------------------------------------------------------------------
  # 7. Host System Metrics Exporter (Node Exporter)
  # ----------------------------------------------------------------------------
  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: thinkers_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - thinkers_monitoring

  # ----------------------------------------------------------------------------
  # 8. Container Resource Metrics (cAdvisor)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: thinkers_cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - thinkers_monitoring

  # ----------------------------------------------------------------------------
  # 9. MySQL Metrics Exporter (mysqld_exporter)
  # ----------------------------------------------------------------------------
  mysqld_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: thinkers_mysql_exporter
    restart: unless-stopped
    command:
      - '--config.my-cnf=/etc/mysqld_exporter/.my.cnf'
    volumes:
      - ./monitoring/prometheus/my.cnf:/etc/mysqld_exporter/.my.cnf:ro
    ports:
      - "9104:9104"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thinkers_internal
      - thinkers_monitoring

  # ----------------------------------------------------------------------------
  # 10. Automated CI/CD Server (Jenkins)
  # ----------------------------------------------------------------------------
  jenkins:
    image: jenkins/jenkins:lts
    container_name: thinkers_jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8089:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - thinkers_internal
      - thinkers_monitoring

# Persistent Storage Volumes
volumes:
  mysql_data:
  static_volume:
  media_volume:
  logs_volume:
  prometheus_data:
  grafana_data:
  jenkins_data:

# Isolated Docker Networks
networks:
  thinkers_internal:
    driver: bridge
  thinkers_monitoring:
    driver: bridge
