# ==============================================================================
# Prometheus Alertmanager Configuration for Thinkers Platform
# Routes notifications to Slack and Email channels
# ==============================================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@thinkers.example.com'
  smtp_auth_username: 'alerts@thinkers.example.com'
  smtp_auth_password: 'smtp_app_password'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity', 'tier']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'devops-team'
  routes:
    - match:
        severity: critical
      receiver: 'devops-critical'
      continue: true

receivers:
  - name: 'devops-team'
    slack_configs:
      - channel: '#thinkers-devops-alerts'
        api_url: 'https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK_URL'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

  - name: 'devops-critical'
    email_configs:
      - to: 'devops-emergency@thinkers.example.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL ALERT] Thinkers Platform: {{ .GroupLabels.alertname }}'
