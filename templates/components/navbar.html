{% load static %}
<nav class="comic-navbar">
  <div class="comic-container">
    <div class="navbar-inner">

        <span class="brand-badge">CLUBS</span>
      </a>

      <!-- Primary Navigation Links -->
      <ul class="nav-links">
        <li>
          <a href="{% url 'club_list' %}" class="nav-link-item {% if request.resolver_match.url_name in 'club_list club_detail club_create' %}active{% endif %}">
            <i data-lucide="compass" class="icon-sm"></i>
            <span>Explore Clubs</span>
          </a>
        </li>
        <li>
          <a href="{% url 'pitch_wall' %}" class="nav-link-item {% if request.resolver_match.url_name in 'pitch_wall challenges' %}active{% endif %}">
            <i data-lucide="rocket" class="icon-sm"></i>
            <span>Pitch Wall</span>
          </a>
        </li>
        <li>
          <a href="{% url 'co_founders' %}" class="nav-link-item {% if request.resolver_match.url_name == 'co_founders' %}active{% endif %}">
            <i data-lucide="users" class="icon-sm"></i>
            <span>Find Co-Founders</span>
          </a>
        </li>
